{% extends 'base.html' %}
{% block title %}Settings{% endblock %}

{% block content %}
<h2 class="mb-3">Settings</h2>

<div class="card shadow-sm">
  <div class="card-body">

    {% if error %}
      <div class="alert alert-danger">{{ error }}</div>
    {% endif %}

    <form method="post">
      <div class="mb-3">
        <label class="form-label">Station Name</label>
        <input class="form-control" name="station_name" value="{{ settings.station_name }}" required>
      </div>

      <div class="mb-3">
        <label class="form-label">Contact Email</label>
        <input class="form-control" type="email" name="contact_email" value="{{ settings.contact_email }}" required>
      </div>

      <button class="btn btn-danger" type="submit">Save</button>
    </form>

  </div>
</div>
{% endblock %}

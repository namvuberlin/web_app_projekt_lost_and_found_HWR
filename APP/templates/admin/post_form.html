{% extends 'base.html' %}
{% block title %}Create Post{% endblock %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
  <h2 class="mb-0">Create Post</h2>
  <a class="btn btn-outline-secondary" href="{{ url_for('admin_posts') }}">Back</a>
</div>

<div class="card shadow-sm">
  <div class="card-body">

    {% if error %}
      <div class="alert alert-danger">{{ error }}</div>
    {% endif %}

    <form method="post">
      <div class="mb-3">
        <label class="form-label">Type</label>
        <select name="post_type" class="form-select" required>
          <option value="" selected disabled>Choose...</option>
          <option value="lost">Lost</option>
          <option value="found">Found</option>
        </select>
      </div>

      <div class="mb-3">
        <label class="form-label">Title</label>
        <input name="title" class="form-control" placeholder="e.g. Keys, Wallet, Laptop..." required>
      </div>

      <div class="mb-3">
        <label class="form-label">Description</label>
        <textarea name="description" class="form-control" rows="4" placeholder="Describe the item..." required></textarea>
      </div>

      <div class="row g-3">
        <div class="col-md-6">
          <label class="form-label">Location</label>
          <input name="location" class="form-control" placeholder="e.g. Library, Room A201">
        </div>

        <div class="col-md-6">
          <label class="form-label">Status</label>
          <select name="status" class="form-select">
            <option value="open" selected>Open</option>
            <option value="claimed">Claimed</option>
            <option value="closed">Closed</option>
          </select>
        </div>
      </div>

      <div class="mt-4">
        <button class="btn btn-danger" type="submit">Save</button>
      </div>
    </form>
  </div>
</div>
{% endblock %}

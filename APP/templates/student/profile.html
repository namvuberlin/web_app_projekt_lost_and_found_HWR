{% extends 'base.html' %}
{% block title %}Profile{% endblock %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
  <h2 class="mb-0">Profile</h2>
  <span class="badge text-bg-dark">Student</span>
</div>

<div class="card shadow-sm">
  <div class="card-body">
    <div class="mb-2">
      <div class="text-muted">Username</div>
      <div class="fw-bold">{{ session.get('username') }}</div>
    </div>

    <hr>

    <div class="mb-2">
      <div class="text-muted">My posts</div>
      <div>Coming soon</div>
    </div>

    <div class="mb-0">
      <div class="text-muted">Messages</div>
      <div>Coming soon</div>
    </div>
  </div>
</div>
{% endblock %}

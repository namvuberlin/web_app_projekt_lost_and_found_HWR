{% extends 'base.html' %}
{% block title %}Create Post{% endblock %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
  <h2 class="mb-0">Create Post</h2>
  <a class="btn btn-outline-secondary" href="{{ url_for('student_dashboard') }}">Back</a>
</div>

<div class="card shadow-sm">
  <div class="card-body">
    <form>
      <div class="mb-3">
        <label class="form-label">Post Type</label>
        <select class="form-select" disabled>
          <option>Lost</option>
          <option>Found</option>
        </select>
        <div class="form-text">Later: choose whether you lost or found an item.</div>
      </div>

      <div class="mb-3">
        <label class="form-label">Title</label>
        <input class="form-control" placeholder="e.g. Black wallet, iPhone, keys..." disabled>
      </div>

      <div class="mb-3">
        <label class="form-label">Description</label>
        <textarea class="form-control" rows="4" placeholder="Describe the item..." disabled></textarea>
      </div>

      <div class="row g-3">
        <div class="col-md-6">
          <label class="form-label">Location</label>
          <input class="form-control" placeholder="Where was it lost/found?" disabled>
        </div>
        <div class="col-md-6">
          <label class="form-label">Date</label>
          <input class="form-control" type="date" disabled>
        </div>
      </div>

      <div class="mt-4">
        <button class="btn btn-dark" type="button" disabled>Submit</button>
      </div>
    </form>
  </div>
</div>
{% endblock %}
